# Release: accepted SHA -> gates -> private GHCR -> immutable digest -> contract.
#
# Publication ends at the digest. This workflow never deploys and never touches PROD;
# the SSH build-on-server deploy in ci.yml is a separate, older path and is untouched.
#
# Component names are explicit on purpose. Findempro ships more than one surface --
# the authenticated app (app.kapitalya.com.bo) and the API (findempro.kapitalya.com.bo) --
# so an artifact named just "findempro" is not a release subject.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to GHCR (uncheck for a dry run that only builds)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"

jobs:
  gate:
    name: Gates
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.evidence.outputs.tests }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: findempro_test
          POSTGRES_USER: findempro
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: findempro.settings.testing
      SECRET_KEY: ci-insecure-key-1234567890-only-for-tests
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      USE_POSTGRES_TESTS: "1"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: findempro_test
      DB_USER: findempro
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CELERY_ALWAYS_EAGER: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: findempro/requirements/production.txt

      - name: Install backend dependencies
        working-directory: findempro
        run: pip install -r requirements/production.txt -r requirements/development.txt

      - name: Migrations are complete
        working-directory: findempro
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Backend suite
        working-directory: findempro
        run: pytest -p no:warnings --tb=short --junitxml=../backend-junit.xml

      # Node 22, no 20: este job es el UNICO que corre `npm run test:components`,
      # y vitest carga jsdom. El lockfile trae jsdom@30 (engines
      # `^22.22.2 || ^24.15.0 || >=26`) y undici@8 (`>=22.19.0`); bajo Node 20
      # undici revienta con `webidl.util.markAsUncloneable is not a function` y
      # los 10 archivos de test fallan al arrancar el worker. El job de frontend
      # de ci.yml sigue en 20 porque solo instala y compila (vite/tsc), sin jsdom.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend suite
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:components
          npm run build

      # Counts are read back from the JUnit report, never typed in: a gate that
      # did not run must not be able to present itself as a zero.
      - name: Collect test evidence
        id: evidence
        run: |
          python3 - <<'PY' > tests-evidence.json
          import json, xml.etree.ElementTree as ET
          root = ET.parse("backend-junit.xml").getroot()
          suites = root.findall("testsuite") or [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(json.dumps({
              "status": "passed" if failed == 0 else "failed",
              "suites": [{
                  "name": "backend",
                  "status": "passed" if failed == 0 else "failed",
                  "passed": total - failed - skipped,
                  "failed": failed,
                  "skipped": skipped,
                  "runner": "pytest",
                  "evidence_path": "backend-junit.xml",
              }],
          }))
          PY
          {
            echo 'tests<<EOF'
            cat tests-evidence.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            backend-junit.xml
            tests-evidence.json

  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write          # the built-in GITHUB_TOKEN is enough; no PAT is involved
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: findempro-app-backend
            context: ./findempro
            file: ./findempro/Dockerfile
            target: runtime
          - component: findempro-app-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish != false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ inputs.publish != false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit release contract
        if: inputs.publish != false
        env:
          TESTS_JSON: ${{ needs.gate.outputs.tests }}
        run: |
          set -euo pipefail
          printf '%s' "$TESTS_JSON" > tests-evidence.json
          python3 release/emit_contract.py \
            --base "release/${{ matrix.component }}.contract-base.json" \
            --out "release-contract-${{ matrix.component }}.json" \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --tag "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}.git" \
            --image "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}" \
            --image-tag "${{ github.ref_name }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --builder-version "$(docker buildx version)" \
            --tests tests-evidence.json

      - name: Summary
        if: inputs.publish != false
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo '```'
            echo "commit ${{ github.sha }}"
            echo "digest ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.publish != false
        with:
          name: release-contract-${{ matrix.component }}
          path: release-contract-${{ matrix.component }}.json
