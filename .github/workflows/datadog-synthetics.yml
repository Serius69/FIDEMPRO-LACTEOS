# Datadog Synthetics — tests sintéticos contra el entorno desplegado.
#
# Requiere DD_API_KEY y DD_APP_KEY como secrets del repositorio. Mientras no
# existan, este workflow NO puede afirmar nada sobre la aplicación: antes fallaba
# en rojo por credenciales ausentes, lo que se leía como "los tests sintéticos
# fallaron" cuando en realidad nunca llegaron a correr.
#
# El gate distingue ahora los dos estados:
#   ENVIRONMENT_NOT_CONFIGURED → faltan credenciales, el job termina neutro y lo
#                                dice en el job summary.
#   TEST_FAILED                → los tests corrieron de verdad y fallaron.
#
# No se inventan credenciales ni se marca PASS lo que no se ejecutó.
name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  synthetics:
    name: Datadog Synthetics
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay credenciales de Datadog?
        id: creds
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Estado — ENVIRONMENT_NOT_CONFIGURED
        if: steps.creds.outputs.configured != 'true'
        run: |
          {
            echo "## Datadog Synthetics — \`ENVIRONMENT_NOT_CONFIGURED\`"
            echo ""
            echo "Faltan \`DD_API_KEY\` y/o \`DD_APP_KEY\` en los secrets del repositorio."
            echo "Los tests sintéticos **no se ejecutaron**; esto no es un fallo de la aplicación."
            echo ""
            echo "Para habilitarlos, cargar ambos secrets."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Datadog Synthetics::ENVIRONMENT_NOT_CONFIGURED — faltan DD_API_KEY/DD_APP_KEY; los tests no corrieron."

      - name: Run Datadog Synthetic tests
        if: steps.creds.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@2b56dc0cca9daa14ab69c0d1d6844296de8f941e
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'

      - name: Estado — TESTS EJECUTADOS
        if: steps.creds.outputs.configured == 'true'
        run: echo "## Datadog Synthetics — tests ejecutados de verdad" >> "$GITHUB_STEP_SUMMARY"
