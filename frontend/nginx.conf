# SPA React/Vite servido bajo /app/ (non-root, puerto 8080).
# Las llamadas a la API usan rutas absolutas (/api, /simulate, ...) y NO pasan
# por aquí: el reverse-proxy principal (findempro_nginx) las enruta a Django.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # ── SPA bajo /app/ — fallback a index.html para react-router ──────────────
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Redirigir /app (sin slash) a /app/
    location = /app {
        return 301 /app/;
    }

    # ── Assets con hash — cache largo e inmutable ─────────────────────────────
    location ~* ^/app/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health del contenedor del SPA
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
