services:

  # ────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: findempro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - findempro_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: findempro_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - findempro_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ────────────────────────────────────────────
  # Backend Django + Gunicorn
  # ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: findempro_backend
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: findempro.settings.production
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - findempro_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────
  # Celery Worker
  # ────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: findempro_celery
    restart: unless-stopped
    command: celery -A findempro worker --loglevel=info --concurrency=4 -Q default,simulations
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: findempro.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
    env_file:
      - .env
    volumes:
      - logs_volume:/app/logs
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - findempro_network
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"

  # ────────────────────────────────────────────
  # Celery Beat (scheduler)
  # ────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: findempro_celery_beat
    restart: unless-stopped
    command: celery -A findempro beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: findempro.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    networks:
      - findempro_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ────────────────────────────────────────────
  # Nginx — Reverse proxy + static files
  # ────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: findempro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - findempro_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ────────────────────────────────────────────
# Volúmenes persistentes
# ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local

# ────────────────────────────────────────────
# Red interna
# ────────────────────────────────────────────
networks:
  findempro_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
