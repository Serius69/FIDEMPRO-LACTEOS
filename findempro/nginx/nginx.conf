user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    # El callback del SSO viaja como GET: `/hub/callback/?hub_token=<JWT>&state=<…>`.
    # Con `"$request"` crudo ese project_token queda escrito EN CLARO en
    # access.log — que se rota, se respalda, se manda a agregadores y lo lee
    # cualquiera con acceso al host — y sigue siendo canjeable hasta que expire.
    # El `state` es el secreto que liga el canje a un navegador: tampoco puede
    # quedar registrado. Se recorta SOLO la query de las peticiones que traen uno
    # de los dos; el resto del tráfico se sigue logueando entero.
    map $request $peticion_con_secreto {
        default                     0;
        "~*[?&](hub_token|state)="  1;
    }
    map $peticion_con_secreto $request_saneado {
        0   $request;
        # Método, ruta y protocolo se conservan: la línea mantiene la forma que
        # esperan los parsers y sigue sirviendo para depurar.
        1   "$request_method $uri?[redactado] $server_protocol";
    }

    # Mismo secreto por la puerta de atrás: al navegar desde el callback el
    # navegador arrastra la URL completa en el Referer (la política es
    # strict-origin-when-cross-origin, que en same-origin manda la query).
    map $http_referer $referer_con_secreto {
        default                     0;
        ""                          2;   # sin Referer → se sigue logueando "-"
        "~*[?&](hub_token|state)="  1;
    }
    map $referer_con_secreto $referer_saneado {
        0   $http_referer;
        1   "[redactado]";
        2   "-";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request_saneado" '
                    '$status $body_bytes_sent "$referer_saneado" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Compresión Gzip ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── Límites de body ──────────────────────────────────────────────────────
    client_max_body_size  20M;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # ── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── Upstream backend ─────────────────────────────────────────────────────
    upstream django_backend {
        server findempro_backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream SPA React (servido por nginx non-root en 8080) ──────────────
    upstream findempro_frontend {
        server findempro_frontend:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Las cabeceras de seguridad (incl. CSP y Permissions-Policy) las emite AHORA
    # Django (SecurityMiddleware + SecurityHeadersMiddleware) en cada respuesta.
    # Antes se definían aquí con una CSP ESTRICTA (sin allowlist de CDNs); al
    # coexistir con la de Django el navegador aplicaba la INTERSECCIÓN (la más
    # restrictiva) y bloqueaba los scripts de CDN (jquery/cdnjs/lordicon…),
    # rompiendo la UI. Se eliminan de nginx para que solo mande la CSP de Django,
    # que sí incluye el allowlist real. (El SPA /app/ trae las suyas del frontend.)

    # Incluir configuración de sitios
    include /etc/nginx/conf.d/*.conf;
}
