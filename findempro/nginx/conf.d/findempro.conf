# ────────────────────────────────────────────
# Redirigir HTTP → HTTPS (activar en producción con SSL real)
# ────────────────────────────────────────────
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ────────────────────────────────────────────
# Servidor principal (HTTP — o HTTPS si SSL está activo)
# ────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;   # Descomentar para HTTPS

    server_name _;           # Reemplazar con tu dominio: findempro.com www.findempro.com

    # ── SSL (descomentar cuando tengas certificados) ─────────────────────────
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_timeout 1d;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_stapling        on;
    # ssl_stapling_verify on;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    # Las cabeceras de seguridad (X-Frame-Options DENY, nosniff, Referrer-Policy,
    # COOP, Content-Security-Policy y Permissions-Policy) las emite AHORA Django
    # (SecurityMiddleware + SecurityHeadersMiddleware) en cada respuesta, de forma
    # consistente en /, /api/ y todo el HTML dinámico. Antes este bloque reañadía
    # un subconjunto MÁS DÉBIL y CONTRADICTORIO (X-Frame SAMEORIGIN vs el DENY de
    # Django, Referrer same-origin vs strict-origin) que además, por la herencia
    # de add_header de nginx, anulaba la CSP del bloque http{}. Se elimina para no
    # duplicar ni contradecir. El SPA /app/ trae sus propias cabeceras del frontend.
    # (HSTS lo gestiona Cloudflare, que termina el TLS.)

    # ── Health check (no logear) ─────────────────────────────────────────────
    location /health/ {
        access_log off;
        proxy_pass         http://django_backend;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── Métricas Prometheus (restringir acceso en producción) ────────────────
    location /metrics {
        allow 127.0.0.1;
        allow 192.168.32.0/20;  # Red interna Docker real (docker network inspect)
        deny all;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

    # ── Archivos estáticos (WhiteNoise los sirve, pero Nginx es más eficiente) ─
    location /static/ {
        alias           /app/staticfiles/;
        expires         1y;
        add_header      Cache-Control "public, immutable";
        access_log      off;
        gzip_static     on;
    }

    # ── Media files ──────────────────────────────────────────────────────────
    location /media/ {
        alias       /app/media/;
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── API — con rate limiting ──────────────────────────────────────────────
    location ~ ^/(api|simulate/api|swagger|redoc) {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;   # Simulaciones pueden tardar
        proxy_send_timeout    30s;

        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── Login — rate limit estricto ──────────────────────────────────────────
    location ~ ^/account/(login|signup) {
        limit_req zone=login burst=3 nodelay;

        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── SPA React (Vite) — servido por el contenedor frontend en /app/ ───────
    location /app/ {
        proxy_pass         http://findempro_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Todo lo demás → Django ───────────────────────────────────────────────
    location / {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID    $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;

        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;

        # No cachear HTML dinámico
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Páginas de error ─────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
