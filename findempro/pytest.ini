[pytest]
DJANGO_SETTINGS_MODULE = findempro.settings.testing
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
    --import-mode=importlib
    --ignore=venv
    --ignore=.venv
    --strict-markers
testpaths = .

# Cobertura opt-in (no forzada para no ralentizar cada corrida):
#   pytest --cov=simulate --cov=hub_auth --cov-report=term-missing
markers =
    slow: tests lentos (simulaciones grandes)
