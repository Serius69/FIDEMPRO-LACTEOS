# Nombre de proyecto explícito: aísla contenedores/red/volúmenes de otros
# productos Kapitalya que corren en este mismo host compartido (ver
# ENVIRONMENTS.md — puertos host reasignados al rango dedicado de findempro).
name: findempro

services:

  # ────────────────────────────────────────────
  # PostgreSQL (dev)
  # ────────────────────────────────────────────
  findempro_db:
    image: postgres:16-alpine
    container_name: findempro_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-findempro_dev}
      POSTGRES_USER: ${DB_USER:-findempro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-findempro} -d ${DB_NAME:-findempro_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findempro_network

  # ────────────────────────────────────────────
  # Redis (dev)
  # ────────────────────────────────────────────
  findempro_redis:
    image: redis:7-alpine
    container_name: findempro_redis_dev
    ports:
      - "127.0.0.1:56383:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - findempro_network

  # ────────────────────────────────────────────
  # Backend Django — runserver con hot-reload
  # ────────────────────────────────────────────
  findempro_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-dev
    container_name: findempro_backend_dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: findempro.settings.development
      DEBUG: "${DEBUG:-False}"
      DB_HOST: findempro_db
      DB_PORT: "5432"
      REDIS_URL: redis://findempro_redis:6379/1
      CELERY_BROKER_URL: redis://findempro_redis:6379/0
      CELERY_RESULT_BACKEND: redis://findempro_redis:6379/0
    env_file:
      - .env.development
    volumes:
      - ./:/app
    ports:
      # NOTA: el rango asignado a findempro pedía 58002, pero ese puerto está
      # tomado en este host por kapdev-hub-frontend (verificado con
      # `ss -ltn` el 2026-08-25). Se usa 58003 (libre, fuera de los rangos
      # reservados de otros productos) — ver ENVIRONMENTS.md.
      - "127.0.0.1:58003:8000"
    depends_on:
      findempro_db:
        condition: service_healthy
      findempro_redis:
        condition: service_healthy
    networks:
      - findempro_network

  # ────────────────────────────────────────────
  # Celery Worker (dev)
  # ────────────────────────────────────────────
  findempro_celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-dev
    container_name: findempro_celery_dev
    command: celery -A findempro worker --loglevel=debug
    environment:
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: findempro.settings.development
      DEBUG: "${DEBUG:-False}"
      DB_HOST: findempro_db
      REDIS_URL: redis://findempro_redis:6379/1
      CELERY_BROKER_URL: redis://findempro_redis:6379/0
      CELERY_RESULT_BACKEND: redis://findempro_redis:6379/0
      CELERY_ALWAYS_EAGER: "false"
    env_file:
      - .env.development
    volumes:
      - ./:/app
    depends_on:
      findempro_db:
        condition: service_healthy
      findempro_redis:
        condition: service_healthy
      findempro_backend:
        condition: service_started
    networks:
      - findempro_network

  # ────────────────────────────────────────────
  # Celery Beat (dev)
  # ────────────────────────────────────────────
  findempro_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-dev
    container_name: findempro_celery_beat_dev
    command: celery -A findempro beat --loglevel=debug --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: findempro.settings.development
      DEBUG: "${DEBUG:-False}"
      DB_HOST: findempro_db
      REDIS_URL: redis://findempro_redis:6379/1
      CELERY_BROKER_URL: redis://findempro_redis:6379/0
      CELERY_RESULT_BACKEND: redis://findempro_redis:6379/0
    env_file:
      - .env.development
    volumes:
      - ./:/app
    depends_on:
      findempro_db:
        condition: service_healthy
      findempro_redis:
        condition: service_healthy
      findempro_backend:
        condition: service_started
    networks:
      - findempro_network

# ────────────────────────────────────────────
# Volúmenes dev
# ────────────────────────────────────────────
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

# ────────────────────────────────────────────
# Red interna — nombre explícito y dedicado (no depende del prefijo de
# proyecto) para no colisionar con la red homónima de docker-compose.prod.yml
# si ambos compose se levantaran desde el mismo directorio.
# ────────────────────────────────────────────
networks:
  findempro_network:
    name: findempro_dev_network
    driver: bridge
